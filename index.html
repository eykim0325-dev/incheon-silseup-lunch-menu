<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>오늘 점심 뭐 먹지?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #dbeafe, #eff6ff);
      color: #1e3a8a;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 35px 24px;
      background: white;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(30, 64, 175, 0.12);
    }

    h1 {
      font-size: 32px;
      margin: 10px 0 15px;
    }

    .description {
      font-size: 19px;
      color: #64748b;
      line-height: 1.6;
    }

    .result {
      min-height: 150px;
      margin: 30px 0;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #eff6ff;
      border: 3px solid #bfdbfe;
      border-radius: 20px;
    }

    .result-label {
      font-size: 18px;
      color: #64748b;
      margin-bottom: 15px;
    }

    #menuResult {
      font-size: 38px;
      font-weight: bold;
      color: #1d4ed8;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      min-height: 78px;
      padding: 18px;
      border: none;
      border-radius: 18px;
      background: #2563eb;
      color: white;
      font-size: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:active {
      transform: scale(0.97);
    }

    button:focus-visible {
      outline: 4px solid #93c5fd;
      outline-offset: 4px;
    }

    .menu-list {
      margin-top: 28px;
      font-size: 16px;
      line-height: 1.9;
      color: #64748b;
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px 18px;
      }

      h1 {
        font-size: 27px;
      }

      #menuResult {
        font-size: 34px;
      }

      button {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>🍽️ 오늘 점심 뭐 먹지?</h1>

    <p class="description">
      점심 메뉴 고민은 이제 그만!<br>
      버튼을 눌러 메뉴를 추천받으세요.
    </p>

    <div class="result" aria-live="polite">
      <div class="result-label">오늘의 추천 메뉴</div>
      <div id="menuResult">❓ 무엇을 먹을까요?</div>
    </div>

    <button type="button" onclick="recommendMenu()">
      🎲 점심 메뉴 추천!
    </button>

    <p class="menu-list">
      🍚 한식 · 🥟 중식 · 🍣 일식<br>
      🍝 양식 · 🍜 분식<br>
      총 20가지 메뉴 중 무작위 추천
    </p>

  </main>

  <script>
    // 추천할 점심 메뉴 목록
    const menus = [
      "김치찌개",
      "된장찌개",
      "제육볶음",
      "불고기",
      "비빔밥",
      "순두부찌개",
      "삼계탕",
      "칼국수",
      "짜장면",
      "짬뽕",
      "탕수육",
      "볶음밥",
      "초밥",
      "돈가스",
      "우동",
      "라멘",
      "파스타",
      "피자",
      "떡볶이",
      "김밥"
    ];

    // 버튼을 누르면 실행되는 함수
    function recommendMenu() {
      // 0부터 메뉴 개수 - 1까지 무작위 번호 생성
      const randomIndex = Math.floor(
        Math.random() * menus.length
      );

      // 해당 번호의 메뉴 선택
      const selectedMenu = menus[randomIndex];

      // 화면에 결과 표시
      document.getElementById("menuResult").textContent =
        "😋 " + selectedMenu;
    }
  </script>

</body>
</html>
